name: Publish

# A tag is the release. The version in package.json must match it, and npm
# refuses a version it already has, so a re-pushed tag cannot overwrite a
# published tarball.
on:
  push:
    tags: [v*]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # A hand-published version makes the tag a no-op rather than a red run:
      # the tag still records the release, and CI still ran the checks.
      - name: Publish to npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "omp-model-gateway@$version" version >/dev/null 2>&1; then
            echo "omp-model-gateway@$version is already on npm — nothing to publish"
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
